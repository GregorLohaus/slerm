# ~/.config/slerm/config.toml
# Omit shell to use $SHELL. Arguments are separate array entries.
# shell = ["/bin/bash", "--login"]
# working_directory = "/home/you"
# Select an installed family; regular, bold, italic and bold italic are matched
# automatically. Install a patched Nerd Font to get its icons.
# font_family = "GeistMono Nerd Font Mono"
# Alternatively load a file; matching style faces are discovered beside it.
# font_path = "/usr/local/share/fonts/MononokiNerdFontMono-Regular.ttf"
# Optional overrides for individual faces:
# font_bold_path = "/path/to/Bold.ttf"
# font_italic_path = "/path/to/Italic.ttf"
# font_bold_italic_path = "/path/to/BoldItalic.ttf"
# Ordered installed fallback families, used for missing glyphs in every style.
# font_fallbacks = ["Symbols Nerd Font Mono"]
# Symbols Nerd Font Mono (or Symbols Nerd Font) is also used automatically when
# installed. Missing styles use the closest available face in the family;
# regular-only fonts retain synthetic bold/italic emphasis.
font_size = 16
scrollback = 10000
# Command for opening scrollback; omit to use $EDITOR, or vi if unset.
# Supports quoted arguments; the scrollback file path is appended automatically.
# Runs directly without shell expansion. The editor should stay in the foreground.
# scrollback_editor = "nvim -R"
window_width = 1100
window_height = 720

# Any theme from `slerm --list-themes`: "slerm" plus every theme Helix ships.
theme = "slerm"

# Shorthand for the [colors] entries of the same name.
# background = "#17191c"
# foreground = "#e2e4e8"
# accent = "#58c4ad"

# Colors overriding the theme, all optional. Alongside the three above:
#   cursor, selection_background, selection_foreground, border,
#   chrome_background, chrome_foreground, chrome_active_background,
#   popup_background,
# and the sixteen ANSI colors:
#   black, red, green, yellow, blue, magenta, cyan, white,
#   and each of those again as bright_black ... bright_white.
# [colors]
# cursor = "#58c4ad"
# red = "#cc6666"
# bright_red = "#d54e53"

[kitty]
image_storage_mb = 64
allow_file = true
allow_temp_file = true
allow_shared_memory = true

[multiplexer]
max_panes = 32
floating_width = 0.65
floating_height = 0.65
# Fractions of the workspace, capped at these many points on large displays.
floating_max_width = 960
floating_max_height = 640

# Providing [keys] replaces the entire default map.
[keys]
"Alt+F" = "toggle_floats"
"Alt+M" = "new_pane"
"Alt+H" = "focus_left"
"Alt+J" = "focus_down"
"Alt+K" = "focus_up"
"Alt+L" = "focus_right"
"Alt+A" = "new_tab"
"Alt+Shift+H" = "previous_tab"
"Alt+Shift+L" = "next_tab"
"Alt+X" = "close_pane"
# Open scrollback in scrollback_editor (or $EDITOR/vi), returning on exit.
"Alt+S" = "open_scrollback"
"Ctrl+Shift+Z" = "zoom_pane"
"Ctrl+Shift+R" = "reload_config"
"Ctrl+Shift+C" = "copy"
"Ctrl+Shift+V" = "paste"
