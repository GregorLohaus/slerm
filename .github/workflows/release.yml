name: Release

# Gitea mirrors branches to GitHub but not necessarily tags, so releases are
# driven by the version in Cargo.toml: bump it on main and the build publishes a
# release named v<version>. Pushes that keep the version only upload an artifact.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-26 # Apple Silicon
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable

      # Zig 0.15.2 can't link against the default Xcode's SDK on the macOS 26 image;
      # Ghostty's CI pins the same version.
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.3.app

      # libghostty-vt-sys builds Ghostty from source, which needs Zig 0.15.2+.
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked

      - name: Bundle slerm.app
        run: scripts/bundle-macos.sh

      - uses: actions/upload-artifact@v4
        with:
          name: slerm-macos
          path: target/bundle/slerm-*

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          if draft="$(gh release view "v$version" --json isDraft --jq .isDraft 2>/dev/null)"; then
            # A draft is invisible to everyone else, so Homebrew's download would 404.
            if [[ "$draft" == true ]]; then
              gh release edit "v$version" --draft=false
              echo "Published the existing draft release v$version."
            else
              echo "Release v$version already exists; bump the version in Cargo.toml to publish a new one."
            fi
            exit 0
          fi
          gh release create "v$version" target/bundle/slerm-* \
            --target "$GITHUB_SHA" --title "slerm $version" --generate-notes --draft=false

      # Points `brew install --cask <owner>/tap/slerm` at the release for the version in
      # Cargo.toml. It runs on every push, so a missed update is repaired by the next one. It
      # downloads the zip anonymously from the same URL the cask uses, so the tap is only updated
      # once Homebrew can fetch it, and the checksum is of the published zip rather than this
      # run's rebuild, which can differ.
      # Needs a HOMEBREW_TAP_TOKEN secret: a fine-grained token with Contents read/write on the
      # <owner>/homebrew-tap repo.
      - name: Update Homebrew cask
        if: github.ref == 'refs/heads/main'
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAP: ${{ github.repository_owner }}/homebrew-tap
        run: |
          if [[ -z "$TAP_TOKEN" ]]; then
            echo "::warning::HOMEBREW_TAP_TOKEN isn't set, so $TAP keeps its current slerm cask"
            exit 0
          fi
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          zip="slerm-$version-macos-arm64.zip"
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/v$version/$zip"
          if ! curl -fsSL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/$zip" "$url"; then
            echo "::error::$url isn't publicly downloadable; is the release still a draft?"
            exit 1
          fi
          git clone -q --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/${TAP}.git" "$RUNNER_TEMP/tap"
          mkdir -p "$RUNNER_TEMP/tap/Casks"
          REPO="$GITHUB_REPOSITORY" scripts/homebrew-cask.sh "$version" "$RUNNER_TEMP/$zip" \
            > "$RUNNER_TEMP/tap/Casks/slerm.rb"
          cd "$RUNNER_TEMP/tap"
          git add Casks/slerm.rb
          if git diff --cached --quiet; then
            echo "The cask is already at $version"
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "slerm $version"
          git push -q origin HEAD
