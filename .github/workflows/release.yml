name: Release

# Releases are driven by tags: pushing v<version> builds slerm <version>, publishes the
# v<version> release and points the Homebrew cask at it. Pushes to main only build and
# upload an artifact. The tag has to reach GitHub, so a Gitea push mirror must sync tags.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-26 # Apple Silicon
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable

      # libghostty-vt-sys builds Ghostty from source, which needs Zig 0.15. Upstream 0.15.2's
      # Mach-O linker only matches `arm64-macos` in .tbd stubs, but SDKs since 26.4 list just
      # `arm64e-macos`, so every libSystem symbol comes up undefined
      # (https://codeberg.org/ziglang/zig/issues/31658). The fix only landed in 0.16; Homebrew's
      # zig@0.15 carries it as a backport, so it links against any Xcode on the image.
      - name: Install Zig
        run: |
          brew install zig@0.15
          echo "$(brew --prefix zig@0.15)/bin" >> "$GITHUB_PATH"

      - name: Show toolchain
        run: zig version && xcrun --show-sdk-path

      # On a tag, the tag is the version: it is written into Cargo.toml and Cargo.lock so
      # `slerm --version`, TERM_PROGRAM_VERSION and the bundle all report it. Other builds keep
      # the version in Cargo.toml.
      - name: Set version
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            version="${GITHUB_REF_NAME#v}"
            if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.+-]+)?$ ]]; then
              echo "::error::Tag $GITHUB_REF_NAME isn't v<semver>, e.g. v0.1.4"
              exit 1
            fi
            V="$version" perl -0pi -e 's/^version = "[^"]*"/version = "$ENV{V}"/m' Cargo.toml
            V="$version" perl -0pi -e 's/(\nname = "slerm"\nversion = )"[^"]*"/$1"$ENV{V}"/' Cargo.lock
            grep -qx "version = \"$version\"" Cargo.toml
          else
            version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          fi
          echo "SLERM_VERSION=$version" >> "$GITHUB_ENV"
          echo "Building slerm $version"

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked

      - name: Bundle slerm.app
        run: scripts/bundle-macos.sh "$SLERM_VERSION"

      - uses: actions/upload-artifact@v4
        with:
          name: slerm-macos
          path: target/bundle/slerm-*

      - name: Publish release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          if draft="$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null)"; then
            # A draft is invisible to everyone else, so Homebrew's download would 404.
            if [[ "$draft" == true ]]; then
              gh release edit "$tag" --draft=false
              echo "Published the existing draft release $tag."
            else
              echo "Release $tag already exists; push a new tag to publish a new one."
            fi
            exit 0
          fi
          gh release create "$tag" target/bundle/slerm-* \
            --verify-tag --title "slerm $SLERM_VERSION" --generate-notes --draft=false

      # Points `brew install --cask <owner>/tap/slerm` at the release for this tag. Re-running the
      # workflow on the tag repairs a missed update. It
      # downloads the zip anonymously from the same URL the cask uses, so the tap is only updated
      # once Homebrew can fetch it, and the checksum is of the published zip rather than this
      # run's rebuild, which can differ.
      # Needs a HOMEBREW_TAP_TOKEN secret: a fine-grained token with Contents read/write on the
      # <owner>/homebrew-tap repo.
      - name: Update Homebrew cask
        if: github.ref_type == 'tag'
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAP: ${{ github.repository_owner }}/homebrew-tap
        run: |
          if [[ -z "$TAP_TOKEN" ]]; then
            echo "::warning::HOMEBREW_TAP_TOKEN isn't set, so $TAP keeps its current slerm cask"
            exit 0
          fi
          version="$SLERM_VERSION"
          zip="slerm-$version-macos-arm64.zip"
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/$zip"
          if ! curl -fsSL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/$zip" "$url"; then
            echo "::error::$url isn't publicly downloadable; is the release still a draft?"
            exit 1
          fi
          git clone -q --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/${TAP}.git" "$RUNNER_TEMP/tap"
          mkdir -p "$RUNNER_TEMP/tap/Casks"
          REPO="$GITHUB_REPOSITORY" scripts/homebrew-cask.sh "$version" "$RUNNER_TEMP/$zip" \
            > "$RUNNER_TEMP/tap/Casks/slerm.rb"
          cd "$RUNNER_TEMP/tap"
          git add Casks/slerm.rb
          if git diff --cached --quiet; then
            echo "The cask is already at $version"
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "slerm $version"
          git push -q origin HEAD
