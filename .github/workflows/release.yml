name: Release

# Gitea mirrors branches to GitHub but not necessarily tags, so releases are
# driven by the version in Cargo.toml: bump it on main and the build publishes a
# release named v<version>. Pushes that keep the version only upload an artifact.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest # Apple Silicon
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable

      # libghostty-vt-sys builds Ghostty from source, which needs Zig 0.15.2+.
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked

      - name: Bundle slerm.app
        run: scripts/bundle-macos.sh

      - uses: actions/upload-artifact@v4
        with:
          name: slerm-macos
          path: target/bundle/slerm-*

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "Release v$version already exists; bump the version in Cargo.toml to publish a new one."
            exit 0
          fi
          gh release create "v$version" target/bundle/slerm-* \
            --target "$GITHUB_SHA" --title "slerm $version" --generate-notes
