[package]
name = "slerm"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "A Ghostty-powered terminal with tiled and floating panes"
license = "MIT"

[dependencies]
anyhow = "1"
ab_glyph = "0.2"
boa_engine = { version = "0.22", default-features = false }
fontdb = "0.23"
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "wgpu", "wayland", "x11"] }
egui = "0.33"
libghostty-vt = { version = "=0.2.1", features = ["png"] }
png = "0.18"
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shell-words = "1"
toml = "0.9"
ts-rs = "12"
wgpu = { version = "27", default-features = false, features = ["std", "vulkan", "gles", "metal", "wgsl"] }
ureq = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSEvent", "NSImage", "NSMenu", "NSMenuItem", "NSResponder"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData", "NSString"] }

[dev-dependencies]
base64 = "0.22"

[profile.release]
lto = "thin"
