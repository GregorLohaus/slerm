<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>Slerm — a little terminal slime</title>
  <desc>A glossy lime-green slime with a dark terminal prompt on a charcoal app tile.</desc>
  <!-- Editable source. All artwork is vector; colors live in the gradients below. -->
  <defs>
    <linearGradient id="tile-color" x1="0" y1="0" x2="0.8" y2="1">
      <stop stop-color="#29372d"/>
      <stop offset="1" stop-color="#101a15"/>
    </linearGradient>
    <linearGradient id="slime-color" x1="0.3" y1="0" x2="0.65" y2="1">
      <stop stop-color="#dcff85"/>
      <stop offset="0.38" stop-color="#a4f44e"/>
      <stop offset="0.75" stop-color="#69da3f"/>
      <stop offset="1" stop-color="#37b94e"/>
    </linearGradient>
    <linearGradient id="shine-color" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f5ffd8" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#f5ffd8" stop-opacity="0"/>
    </linearGradient>
    <filter id="tile-shadow" x="-20%" y="-20%" width="140%" height="145%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-opacity="0.26"/>
    </filter>
    <filter id="slime-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="20" stdDeviation="18" flood-color="#030d08" flood-opacity="0.48"/>
    </filter>
  </defs>

  <g id="app-tile">
    <rect x="96" y="96" width="832" height="832" rx="188"
      fill="url(#tile-color)" filter="url(#tile-shadow)"/>
    <rect x="98" y="98" width="828" height="828" rx="186"
      fill="none" stroke="#d8ffe0" stroke-opacity="0.15" stroke-width="3"/>
  </g>

  <g id="slime" filter="url(#slime-shadow)">
    <!-- One continuous silhouette: reshape the curves to change the drips. -->
    <path id="slime-body" d="
      M 235,418
      C 223,340 262,282 334,272
      C 366,215 444,215 490,246
      C 557,211 628,232 656,274
      C 729,268 782,319 778,380
      C 826,424 817,496 794,537
      C 815,584 794,631 762,642
      L 762,691
      C 762,729 717,737 709,697
      L 706,654
      C 686,644 665,647 648,664
      L 648,755
      C 648,815 570,815 570,755
      L 570,686
      C 548,667 522,672 501,688
      L 501,715
      C 501,757 449,759 446,718
      L 443,676
      C 418,665 396,670 377,691
      L 377,746
      C 377,795 311,795 311,746
      L 311,658
      C 245,646 210,607 225,550
      C 193,507 204,452 235,418 Z"
      fill="url(#slime-color)" stroke="#173d23" stroke-width="12" stroke-linejoin="round"/>

    <g id="gloss" fill="url(#shine-color)">
      <path d="M 264,401 C 253,343 292,305 349,304 C 377,259 427,259 454,277
        C 399,276 388,314 355,325 C 304,326 280,351 276,397 C 274,410 267,412 264,401 Z"/>
      <path d="M 509,275 C 553,249 605,268 623,292 C 575,275 551,277 520,292
        C 505,299 497,283 509,275 Z"/>
      <ellipse cx="724" cy="365" rx="17" ry="25" transform="rotate(-27 724 365)"/>
      <path d="M 586,707 L 586,751 C 586,783 602,788 608,780 C 592,781 598,747 598,710 Z" opacity="0.35"/>
    </g>
    <g id="tiny-bubbles" fill="#efffc3" opacity="0.36">
      <circle cx="282" cy="555" r="10"/>
      <circle cx="735" cy="567" r="8"/>
      <circle cx="700" cy="309" r="7"/>
    </g>
  </g>

  <!-- The terminal prompt is separate from the slime for easy editing. -->
  <g id="terminal-prompt" fill="none" stroke="#173b23" stroke-width="48"
    stroke-linecap="round" stroke-linejoin="round">
    <path id="chevron" d="M 333,418 L 432,498 L 333,578"/>
    <path id="cursor" d="M 514,578 H 672"/>
  </g>
</svg>
